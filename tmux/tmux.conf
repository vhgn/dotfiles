set -g status on
set -g status-justify left

# set -g status-left '#[bg=colour4,fg=colour232] #S #[bg=colour236,fg=default,nobold] '
# Session name: render slash-delimited names as "part / part / part". Slashes
# are intentionally very light.
set -g status-left '#[bg=colour4,fg=colour232,bold] #{?#{m:*/*/*,#{session_name}},#{s|^ *([^/ ]+) */ *([^/ ]+) */ *(.*)$|\1 #[fg=colour254,nobold]/ #[fg=colour232,bold]\2 #[fg=colour254,nobold]/ #[fg=colour232,bold]\3|:session_name},#{?#{m:*/*,#{session_name}},#{s|^ *([^/ ]+) */ *(.*)$|\1 #[fg=colour254,nobold]/ #[fg=colour232,bold]\2|:session_name},#{session_name}}} #[bg=colour236,fg=default,nobold] '
set -g status-left-length 32
set -g status-right ''

set -g window-status-separator '#[bg=colour236,fg=colour240] | '

set -g window-status-format '#[bg=colour236,fg=colour245] #I #[fg=colour255,bold]#W '
set -g window-status-current-format '#[bg=colour255,fg=colour245] #I #[fg=colour236,bold]#W '

set -g status-style bg=colour236,fg=colour255

bind-key r respawn-pane -k
# Open new windows in the current pane's working directory.
bind c new-window -c "#{pane_current_path}"

# Do not auto rename windows
set-option -g allow-rename off

set -g default-terminal "xterm-ghostty"

# Scroll history
set -g history-limit 100000

# Scroll with mouse
setw -g mouse on

# Vim
set-option -g focus-events on

# Use 1-based indexes for windows and panes.
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed — no gaps in window indexes.
# tmux does not have a renumber-panes option; pane indexes stay compact and use pane-base-index.
set -g renumber-windows on

# PI recommendations
set -g extended-keys on
set -g extended-keys-format csi-u
